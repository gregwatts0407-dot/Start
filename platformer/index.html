<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Platformer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="layout">
    <header class="hud">
      <div class="stat"><span class="label">Level</span><span id="level" class="value">1 / 3</span></div>
      <div class="stat"><span class="label">Coins</span><span id="coins" class="value coins">0</span></div>
      <div class="stat"><span class="label">Lives</span><span id="lives" class="value lives">3</span></div>
      <div class="stat"><span class="label">Time</span><span id="time" class="value">0:00</span></div>
      <div class="controls">
        <button id="restart" title="Restart level (R)">Restart</button>
        <button id="pause" title="Pause (P)">Pause</button>
      </div>
    </header>
    <div class="canvas-wrap">
      <canvas id="game" width="800" height="480"></canvas>
      <div id="overlay" class="overlay hidden">
        <div class="overlay-card">
          <h1 id="overlayTitle">Platformer</h1>
          <p id="overlayText"></p>
          <button id="overlayButton" class="primary">Play</button>
        </div>
      </div>
    </div>
    <div class="touch-controls">
      <div class="pad">
        <button data-action="left" aria-label="Move left">&#9664;</button>
        <button data-action="right" aria-label="Move right">&#9654;</button>
      </div>
      <button data-action="jump" class="jump" aria-label="Jump">Jump</button>
    </div>
    <p class="hint mouse-only">Move with <kbd>&larr;</kbd> <kbd>&rarr;</kbd> or <kbd>A</kbd> <kbd>D</kbd>.
      Jump with <kbd>Space</kbd>, <kbd>&uarr;</kbd>, <kbd>W</kbd> or <kbd>Z</kbd> (hold it to jump higher).
      <kbd>P</kbd> pauses, <kbd>R</kbd> restarts the level.</p>
    <p class="hint touch-only">Use the arrow buttons to move and Jump to jump. Hold Jump to jump higher.</p>
    <p class="hint"><a href="../index.html">Play the tower-defense game</a></p>
  </main>
  <script src="game.js"></script>
</body>
</html>
