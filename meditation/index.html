<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Stillpoint — meditation timer</title>
    <meta
      name="description"
      content="A calm, free meditation timer, breathing guide and ambient soundscapes. No sign-up, no tracking, works offline."
    />
    <meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16191b" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Stillpoint" />

    <!-- Open Graph / link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stillpoint" />
    <meta property="og:title" content="Stillpoint — a calm meditation timer" />
    <meta
      property="og:description"
      content="Meditation timer, guided breathing and gentle soundscapes. Free, private and works offline."
    />
    <meta property="og:image" content="__SITE_URL__og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Stillpoint lotus on a soft sage background" />
    <meta property="og:url" content="__SITE_URL__" />
    <meta property="og:locale" content="en_AU" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stillpoint — a calm meditation timer" />
    <meta
      name="twitter:description"
      content="Meditation timer, guided breathing and gentle soundscapes. Free, private and works offline."
    />
    <meta name="twitter:image" content="__SITE_URL__og-image.png" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('stillpoint:v1:settings') || '{}');
        var dark = s.theme === 'dark' || (s.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Stillpoint needs JavaScript turned on.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
